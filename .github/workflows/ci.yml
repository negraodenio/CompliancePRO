name: CI/CD & Container Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      # npm test requires the gitignored `.env.test.local` file with SUPABASE_URL,
      # SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY, cryptographically validated
      # against the dedicated TEST Supabase project by tests/test-supabase-environment.mjs.
      # The file is intentionally provisioned at runtime from repository secrets and
      # is never committed. Missing secrets fail fast with an actionable error.
      - name: Provision TEST Environment File (from repository secrets)
        env:
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::TEST Supabase repository secrets are not configured (TEST_SUPABASE_URL, TEST_SUPABASE_ANON_KEY, TEST_SUPABASE_SERVICE_ROLE_KEY). Configure them to enable the governance test suite in CI."
            exit 1
          fi
          umask 077
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
          } > .env.test.local

      - name: Run Full Governance Test Suite
        run: npm test
        env:
          NODE_ENV: test

      - name: Production Vite Build
        run: npm run build

  container-build-and-smoke-test:
    name: Docker Build & Security Smoke Test
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Production Docker Image
        run: docker build -t complypro-server:ci .

      - name: Run Containerized ComplyPRO Instance
        run: |
          docker run -d \
            --name complypro-smoke-test \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            complypro-server:ci

      - name: Verify Health and Readiness Endpoints
        run: |
          sleep 6
          echo "Checking Liveness Probe (/health)..."
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:3000/health
          echo -e "\nChecking Readiness Probe (/ready)..."
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:3000/ready
          echo -e "\nHealthcheck verified successfully."

      - name: Verify Non-Root User Execution
        run: |
          USER_ID=$(docker exec complypro-smoke-test id -u)
          USER_NAME=$(docker exec complypro-smoke-test id -un)
          echo "Container User: $USER_NAME (UID: $USER_ID)"
          if [ "$USER_ID" = "0" ]; then
            echo "SECURITY ERROR: Container must not run as root!"
            exit 1
          fi
          echo "PASS: Non-root user verified ($USER_NAME / UID $USER_ID)"

      - name: Teardown Test Container
        if: always()
        run: docker stop complypro-smoke-test && docker rm complypro-smoke-test
